base_generic:
    role: |
        You are an expert ontology validator and health economist 
        specializing in Health Technology Assessment (HTA) models. 
        Your primary responsibility is to critically review, audit, 
        and correct existing entities form an ontologies provided 
        to you in [OWL/RDF] format. These ontologies contain data 
        generated by HTA modelers concerning specific interventions, 
        health problems, and populations from the perspective of 
        the Spanish National Health System (SNS). All the entities
        to evaluate follow the follow OWL Ontology:

        {base_ontology}

    constraints: |
        Do not make up information. If context is missing, say so.
        Be brutally strict with the schema.

preprocessing:
    entity_extraction:
        prompt: |
            Analyze the following medical text generated by an AI.
            Extract all specific clinical entities or individuals mentioned.
            Return ONLY a valid JSON array of strings. Do not include markdown 
            formatting or explanations.
        
        Example output: ["Patient_A", "Metformin_500mg", "Type2_Diabetes"]
        
        Text to analyze: {ai_entity}

evaluation_suites:
    owl_validations:
        defaults:
            temperatures: [0.3, 0.6]
            allow_web_search: false
            enable_self_criticism: true

        tasks:
            structural_evaluation:
                examples:
                - input: |
                      {"entity_id": "BTD_Manif_OpticAtrophy_U", "class_types": ["UtilityParameter"], "properties": {"hasExpectedValue": "0.23"}}
                  output: |
                      {
                        "reasoning": "Class 'UtilityParameter' is not defined in the TBox. It is a structural hallucination to instantiate non-existent classes.",
                        "status": "FAILURE",
                        "findings": ["Class 'UtilityParameter' undefined"]
                      }
                - input: |
                      {"entity_id": "BTD_Manif_DevelopmentalDelay", "class_types": ["Manifestation"], "properties": {"hasDescription": "Retraso del desarrollo"}}
                  output: |
                        {
                          "reasoning": "Both the 'Manifestation' class and the 'hasDescription' DataProperty exist in the base ontology. No structural violations.",
                          "status": "SUCCESS",
                          "findings": []
                        }
                prompt: |
                    TYPE: Structural Hallucination.

                    [INSTRUCTIONS]
                    You are a strict OWL inference engine. Analyze the following individual against the Base Ontology.
                    1. Verify that EVERY element in `class_types` exists in the Base Ontology.
                    2. Verify that EVERY key in `properties` exists as a property in the Base Ontology.

                    Individual to evaluate:
                    {individual_response}

            semantic_evaluation:
                examples:
                - input: |
                    {"entity_id": "DBTD_Manif_Acute_Acidosis", "class_types": ["AcuteManifestation"], "properties": {"isManifestationOf": "http://www.ull.es/is/simulation/ontologies/disease-simulation#DBTD_Disease"}}
                  output: |
                    {
                      "reasoning": "The property 'isManifestationOf' is an ObjectProperty. A URI string was injected as a literal instead of instantiating the relationship with an individual. This is a semantic violation.",
                      "status": "FAILURE",
                      "findings": ["Object property 'isManifestationOf' used as data property"]
                    }
                - input: |
                    {"entity_id": "DBTD_Manif_Acute_Alopecia", "class_types": ["AcuteManifestation"], "properties": {"isManifestationOf": ["DBTD_Disease"]}}
                  output: |
                    {
                      "reasoning": "The 'isManifestationOf' property is an ObjectProperty and correctly points to another individual's ID ('DBTD_Disease'). Type semantics are consistent.",
                      "status": "SUCCESS",
                      "findings": []
                    }
                prompt: |
                    TYPE: Semantic Hallucination.

                    [INSTRUCTIONS]
                    Evaluate if the ontology terms in the response are combined in logically inconsistent ways.
                    Look for Domain/Range violations and ObjectProperties assigned to literal strings.

                    Response to evaluate:
                    {individual_response}

            contextual_evaluation:
                examples:
                - input: |
                    {"user_input": "Define the treatment cost", "individual_response": "{\"entity_id\": \"BTD_Treatment\", \"class_types\": [\"Intervention\"]}"}
                  output: |
                    {
                      "reasoning": "The user requested cost parameters. The generated entity is a medical intervention, completely omitting the requested economic data. It fails the original context.",
                      "status": "FAILURE",
                      "findings": ["Entity does not address requested context (Cost)"]
                    }
                - input: |
                    {"user_input": "Define profound disease state", "individual_response": "{\"entity_id\": \"BTD_Disease_Profound\", \"class_types\": [\"Disease\"]}"}
                  output: |
                    {
                      "reasoning": "The extracted individual corresponds to the profound deficiency state of the disease, aligning with the user's request.",
                      "status": "SUCCESS",
                      "findings": []
                    }
                prompt: |
                    TYPE: Contextual Hallucination.

                    [INSTRUCTIONS]
                    Evaluate if the extracted response fails to meet the specific requirements of the original user input. 
                    Ignore structural OWL validity here; focus only on prompt alignment.

                    Original User Input:
                    {user_input}

                    Response to evaluate:
                    {individual_response}

            factuality_evaluation:
                allow_web_search: true
                examples:
                - input: |
                    {"entity_id": "BTD_Manif_OpticAtrophy_Prob", "class_types": ["Parameter"], "properties": {"hasExpectedValue": "0.30", "hasSource": "Salbert BA, Astruc J... Ophthalmologica 1993"}}
                  output: |
                    {
                      "reasoning": "Upon verifying the provided source (Salbert et al., 1993), the article does not report an exact value of 30% (0.30) for optic atrophy. The value was fabricated and incorrectly attributed to a real paper.",
                      "status": "FAILURE",
                      "findings": ["Value not found in source"]
                    }
                - input: |
                    {"entity_id": "BTD_CriticalWindow_Treatment", "class_types": ["EpidemiologicalParameter"], "properties": {"hasExpectedValue": "30", "hasSource": "Máximo 30 días tras inicio de síntomas[8][10]"}}
                  output: |
                    {
                      "reasoning": "The 'hasSource' field contains Wikipedia-style citation markers ('[8][10]') and narrative text instead of a traceable academic citation. This invalidates data verifiability.",
                      "status": "FAILURE",
                      "findings": ["Unsuitable source format"]
                    }
                - input: |
                    {"entity_id": "BTD_Incidence_Global", "class_types": ["EpidemiologicalParameter"], "properties": {"hasExpectedValue": "0.000016", "hasSource": "Wolf B. Biotinidase deficiency. GeneReviews 2000"}}
                  output: |
                    {
                      "reasoning": "Medical literature establishes that the estimated incidence of profound biotinidase deficiency is 1 in 60,000 (approx. 0.000016). The citation of Wolf B. in GeneReviews is appropriate and corroborates the clinical value.",
                      "status": "SUCCESS",
                      "findings": []
                    }
                prompt: |
                    TYPE: Evidence-based (Factuality) Hallucination.

                    [INSTRUCTIONS]
                    Evaluate if the literals, medical conditions, numerical values, or treatments produced in the response 
                    are unsupported or factually incorrect according to current medical evidence and HTA guidelines.
                    Pay special attention to fake citations ("Unsuitable source") or values falsely attributed to real papers ("Value not found in source").
                    Use Google Search to verify clinical claims regarding Biotinidase Deficiency.

                    Response to evaluate:
                    {individual_response}